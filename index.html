<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Digitální past – zabezpečený přístup</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --paper-red: #760000;
  --note-1: #dc322f4d;
  --note-2: #268bd24d;
  --note-3: #e6be0061;
  --note-4: #2ea0434d;
}

html,
body {
  background: #fff;
  min-height: 100%;
  margin: 0;
}

body {
  overflow-x: hidden;
}

.qr-experience {
  min-height: 100vh;
}

/* ==================================================
   POLICEJNÍ DATABÁZE O.R.I.O.N.
================================================== */

.orion-gate {
  z-index: 1000;
  color: #d8efff;
  opacity: 1;
  visibility: visible;

  background:
    radial-gradient(
      circle at 50% 42%,
      #1067a43d,
      transparent 40%
    ),
    linear-gradient(
      155deg,
      #071523 0%,
      #06101c 58%,
      #02070c 100%
    );

  place-items: center;
  min-height: 100svh;
  padding: 26px;

  font-family:
    "Courier New",
    Courier,
    monospace;

  transition:
    opacity .62s,
    visibility .62s step-start;

  display: grid;
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.phase-revealed .orion-gate {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity .62s,
    visibility .62s step-end;
}

.orion-gate::before {
  content: "";
  pointer-events: none;

  background-image:
    linear-gradient(
      #2196f307 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      #2196f306 1px,
      transparent 1px
    );

  background-size: 32px 32px;
  position: absolute;
  inset: 0;

  mask-image:
    radial-gradient(
      circle,
      black 30%,
      transparent 85%
    );
}

.orion-gate::after {
  content: "";
  pointer-events: none;

  background:
    repeating-linear-gradient(
      0deg,
      #ffffff05 0 1px,
      transparent 1px 4px
    );

  position: absolute;
  inset: 0;
}

.orion-scanline {
  z-index: 1;
  pointer-events: none;

  background:
    linear-gradient(
      transparent,
      #2aa4eb14,
      transparent
    );

  height: 90px;
  animation: scan 3.7s linear infinite;

  position: absolute;
  left: 0;
  right: 0;
}

.orion-frame {
  z-index: 2;

  background: #031320e6;
  border: 1px solid #4ca9e07a;

  width: min(720px, 100%);
  position: relative;

  box-shadow:
    0 0 0 5px #09446724,
    0 0 55px #0082d22b,
    inset 0 0 55px #004d7a1f;
}

.orion-frame::before,
.orion-frame::after {
  content: "";
  pointer-events: none;

  width: 38px;
  height: 38px;
  position: absolute;
}

.orion-frame::before {
  border-top: 2px solid #58bff5;
  border-left: 2px solid #58bff5;

  top: -8px;
  left: -8px;
}

.orion-frame::after {
  border-bottom: 2px solid #58bff5;
  border-right: 2px solid #58bff5;

  bottom: -8px;
  right: -8px;
}

.orion-header {
  text-align: center;
  border-bottom: 1px solid #47a1d559;
  padding: 28px 32px 23px;
}

.orion-kicker,
.orion-subtitle {
  color: #79acd0;
  letter-spacing: .2em;
  text-transform: uppercase;
  font-size: 10px;
}

.orion-header h1 {
  color: #e5f6ff;
  letter-spacing: .24em;
  text-indent: .24em;

  text-shadow:
    0 0 18px #4dbbf261;

  margin: 7px 0 6px;

  font-size: clamp(31px, 7vw, 52px);
  font-weight: 500;
  line-height: 1;
}

.orion-casebar {
  color: #82b7d9;
  letter-spacing: .13em;
  border-bottom: 1px solid #47a1d547;

  grid-template-columns:
    auto 1fr auto;

  align-items: center;
  gap: 15px;

  padding: 12px 22px;
  font-size: 10px;
  display: grid;
}

.orion-casebar strong {
  color: #f1fbff;
  letter-spacing: .16em;
  font-size: 12px;
}

.orion-route {
  justify-self: end;
}

.orion-status {
  text-align: center;

  flex-direction: column;
  justify-content: center;
  align-items: center;

  min-height: 285px;
  padding: 35px 42px 31px;
  display: flex;
}

.orion-message {
  color: #ddf3ff;
  letter-spacing: .085em;

  text-shadow:
    0 0 9px #38b0eb3b;

  max-width: 570px;
  margin: 28px 0 27px;

  font-size: clamp(13px, 2.4vw, 16px);
  font-weight: 700;
  line-height: 1.7;
}

.orion-loader {
  align-items: flex-end;
  gap: 5px;
  height: 34px;
  display: flex;
}

.orion-loader i {
  background: #5abef3;
  width: 5px;
  height: 13px;

  animation:
    .9s ease-in-out infinite alternate equalize;

  display: block;

  box-shadow:
    0 0 8px #50bef8bf;
}

.orion-loader i:nth-child(2) {
  animation-delay: -.6s;
}

.orion-loader i:nth-child(3) {
  animation-delay: -.3s;
}

.orion-loader i:nth-child(4) {
  animation-delay: -.75s;
}

.orion-loader i:nth-child(5) {
  animation-delay: -.15s;
}

.orion-progress {
  background: #02080ebf;
  border: 1px solid #5bb9ec52;

  width: min(430px, 100%);
  height: 3px;
  overflow: hidden;
}

.orion-progress span {
  background: #55b8ec;

  width: 100%;
  height: 100%;

  animation:
    12s cubic-bezier(.15,.65,.35,1)
    forwards authorize;

  display: block;
  transform: translateX(-100%);

  box-shadow:
    0 0 13px #4db8f1;
}

.orion-small {
  color: #5f98bd;
  letter-spacing: .18em;
  margin: 13px 0 0;
  font-size: 9px;
}

.approval-block {
  color: #83efad;

  flex-direction: column;
  align-items: center;

  display: flex;
}

.approval-check {
  fill: none;
  stroke: #58e796;

  stroke-linecap: round;
  stroke-linejoin: round;

  filter:
    drop-shadow(
      0 0 11px #3be3856b
    );

  width: 105px;
  height: 105px;
  overflow: visible;
}

.check-circle {
  stroke-width: 2px;
  stroke-dasharray: 258;
  stroke-dashoffset: 258;

  animation:
    .72s ease-out 50ms forwards draw-check;
}

.check-mark {
  stroke-width: 5px;
  stroke-dasharray: 72;
  stroke-dashoffset: 72;

  animation:
    .48s ease-out .62s forwards draw-check;
}

.approval-block p {
  letter-spacing: .1em;
  margin: 21px 0 9px;

  font-size: clamp(15px, 3vw, 20px);
  font-weight: 700;
  line-height: 1.45;
}

.approval-block span {
  color: #5aa878;
  letter-spacing: .18em;
  font-size: 9px;
}

.orion-footer {
  color: #457b9e;
  letter-spacing: .12em;

  border-top: 1px solid #47a1d547;

  justify-content: space-between;
  gap: 20px;

  padding: 10px 18px;
  font-size: 8px;
  display: flex;
}

/* ==================================================
   DŮKAZNÍ MATERIÁLY
================================================== */

.evidence-page {
  opacity: 0;

  color: #050505;
  letter-spacing: .06em;

  background:
    radial-gradient(
      circle at 50% 18%,
      #00000012,
      transparent 24%
    ),
    radial-gradient(
      circle at 12% 78%,
      #7800000d,
      transparent 26%
    ),
    repeating-linear-gradient(
      0deg,
      #00000007 0 1px,
      transparent 1px 7px
    ),
    #fff;

  min-height: 100vh;

  font-family:
    "Courier New",
    Courier,
    monospace;

  font-size: 14px;

  transition:
    opacity .7s .2s,
    transform .7s .2s;

  transform: translateY(5px);
}

.phase-revealed .evidence-page {
  opacity: 1;
  transform: none;
}

.evidence-page::before {
  content: "";

  z-index: 10;
  pointer-events: none;

  border: 1px solid #00000047;

  position: fixed;
  inset: 18px;
}

.target-page {
  display: none;
}

.target-page.is-active {
  display: block;
}

.paper {
  background:
    linear-gradient(
      90deg,
      #0000000d,
      transparent 13% 87%,
      #00000009
    ),
    #fff;

  border-left: 2px solid #000c;
  border-right: 1px solid #00000040;

  width: 100%;
  max-width: 460px;
  min-height: 100vh;

  margin: 0 auto;
  padding: 54px 40px 62px;

  position: relative;

  box-shadow:
    18px 0 #00000009,
    -18px 0 #78000009;
}

.paper::before {
  content: "";

  opacity: .85;
  background: #000;

  height: 2px;

  position: absolute
